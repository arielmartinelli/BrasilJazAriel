<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <defs>
    <clipPath id="argClip">
      <rect x="0" y="0" width="50" height="100" />
    </clipPath>
    <clipPath id="braClip">
      <rect x="50" y="0" width="50" height="100" />
    </clipPath>
  </defs>

  <!-- Base rounded container -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#009C3B" />

  <!-- LEFT HALF: ARGENTINA -->
  <g clipPath="url(#argClip)">
    <rect x="0" y="0" width="100" height="33.33" fill="#74ACDF" />
    <rect x="0" y="33.33" width="100" height="33.34" fill="#FFFFFF" />
    <rect x="0" y="66.67" width="100" height="33.33" fill="#74ACDF" />
    
    <!-- Sol de Mayo -->
    <circle cx="50" cy="50" r="12" fill="#F6B40E" />
    <circle cx="50" cy="50" r="8" fill="#85340A" opacity="0.15" />
    <path
      d="M 50 34 L 50 30 M 50 66 L 50 70 M 34 50 L 30 50 M 39 39 L 36 36 M 39 61 L 36 64"
      stroke="#F6B40E"
      strokeWidth="2.5"
      strokeLinecap="round"
    />
  </g>

  <!-- RIGHT HALF: BRASIL -->
  <g clipPath="url(#braClip)">
    <rect x="0" y="0" width="100" height="100" fill="#009C3B" />
    <polygon points="50,15 90,50 50,85 10,50" fill="#FFDF00" />
    <circle cx="50" cy="50" r="18" fill="#002776" />
    <path
      d="M 33 46 Q 50 54 67 48"
      fill="none"
      stroke="#FFFFFF"
      strokeWidth="3.5"
      strokeLinecap="round"
    />
  </g>

  <!-- Divider -->
  <line x1="50" y1="0" x2="50" y2="100" stroke="#FFFFFF" strokeWidth="1.5" opacity="0.9" />
</svg>
